<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa Conceitual SER GAJU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: mapa em tela cheia à esquerda, lista de frases à direita; empilha no celular */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --fg:#17211f; --muted:#5d6b67; --line:#c3ccc9;
  --node:#ffffff; --node-line:#8fa09b; --edge:#8a9894; --accent:#0f6b5c; --accent-soft:#d9efe9; --halo:#f5f7f6;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101514; --surface:#18201e; --fg:#e6eeeb; --muted:#9aaaa5; --line:#2d3936;
  --node:#1d2725; --node-line:#566763; --edge:#6c7d79; --accent:#5fd0b5; --accent-soft:#1d3a34; --halo:#101514; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101514; --surface:#18201e; --fg:#e6eeeb; --muted:#9aaaa5; --line:#2d3936;
  --node:#1d2725; --node-line:#566763; --edge:#6c7d79; --accent:#5fd0b5; --accent-soft:#1d3a34; --halo:#101514; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font-family:var(--font-head);font-size:1.5rem;line-height:1.15;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.9rem;min-width:0}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.map{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0;min-width:0}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg.drag{cursor:grabbing}
.tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.tools button{min-width:36px;height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer;font-family:var(--font-body)}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
header .hint{flex-basis:100%;font-size:.82rem}
.node rect{fill:var(--node);stroke:var(--node-line);stroke-width:1.2}
.node text{fill:var(--fg);font-family:var(--font-body);font-size:14px;text-anchor:middle;pointer-events:none}
.node{cursor:pointer;outline:none}
.node.core rect{stroke:var(--accent);stroke-width:2.4}
.node:focus-visible rect{stroke:var(--accent);stroke-width:3}
.edge path{fill:none;stroke:var(--edge);stroke-width:1.3}
.edge text{font-size:12.5px;fill:var(--muted);text-anchor:middle;font-family:var(--font-body);paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round}
.dim .node,.dim .edge{opacity:.16}
.dim .node.on,.dim .edge.on{opacity:1}
.edge.on path{stroke:var(--accent);stroke-width:2.2}
.edge.on text{fill:var(--accent);font-weight:600}
.node.on rect{stroke:var(--accent);stroke-width:2}
.node.sel rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}
aside{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
aside .top{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
aside h2{font-family:var(--font-head);font-size:1.05rem;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
aside h2 span{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:400}
#q{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem}
#q:focus{outline:2px solid var(--accent);outline-offset:0}
#clear{align-self:flex-start;font:inherit;font-size:.8rem;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:0}
li button{display:block;width:100%;text-align:left;font:inherit;font-size:.88rem;color:var(--fg);background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
li button:hover{background:var(--accent-soft)}
li button.sel{background:var(--accent-soft);outline:1px solid var(--accent)}
li b{font-weight:600}
li i{color:var(--accent);font-style:normal}
.empty{padding:14px;color:var(--muted);font-size:.9rem}
@media (max-width:820px){
  html,body{height:auto}
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto}
  aside{max-height:60vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header>
  <h1>Mapa Conceitual SER GAJU</h1>
  <p id="sub"></p>
  <p class="hint">Arraste para mover, role para dar zoom e clique em um conceito para ver as frases dele. O contorno forte marca o ponto central do diagnóstico.</p>
</header>
<div class="wrap">
  <div class="map" id="map">
    <svg id="svg" role="img" aria-label="Mapa conceitual da GAJU"></svg>
    <div class="tools">
      <button id="zin" aria-label="Aproximar">+</button>
      <button id="zout" aria-label="Afastar">−</button>
      <button id="zfit" aria-label="Ver mapa inteiro" style="font-size:13px">Tudo</button>
    </div>
  </div>
  <aside>
    <div class="top">
      <h2>Frases do mapa <span id="count"></span></h2>
      <input id="q" type="search" placeholder="Buscar conceito ou termo" aria-label="Buscar no mapa" autocomplete="off">
      <button id="clear" hidden>Mostrar todas as frases</button>
    </div>
    <ul id="list"></ul>
  </aside>
</div>

<script>
// Conceitos com posição (x,y) tirada do mapa original. "\n" quebra linha.
const N = {
 "Membros":[349,14],
 "Senso de pertencimento":[648,134],
 "Reconhecimento de Marca":[1257,222],
 "Engajamento":[136,253],
 "MVV":[1031,354],
 "Cultura fortalecida":[128,397],
 "Plano Estratégico":[598,386],
 "Diretoria Executiva":[820,496],
 "Identidade Visual":[1261,475],
 "Posicionamento de marca":[1040,530],
 "Comunicação":[1041,622],
 "O cliente vem até nós":[1884,584],
 "Prospecção Passiva":[1654,668],
 "Marketing":[1288,671],
 "Gestão de Pessoas":[445,703],
 "Projetos":[1574,788],
 "Projetos pilotos":[1890,790],
 "DCOM":[1323,836],
 "ADM/FINAN":[836,846,"ADM/\nFINAN"],
 "Visibilidade da EJ":[1146,877,"Visibilidade\nda EJ"],
 "Regularização da EJ":[686,894,"Regularização\nda EJ"],
 "Estabilidade financeira":[970,968,"Estabilidade\nfinanceira"],
 "Prospecção Ativa":[1462,928],
 "Desenvolvimento de Carreira":[452,928],
 "Serviços fixos":[1896,1034],
 "Treinamento e Capacitações":[220,1010],
 "Atas de eleição":[662,1027],
 "Clientes":[1146,1049],
 "Busca por Clientes":[1472,1071],
 "Gestões futuras":[468,1082],
 "Carta de Serviços":[1902,1212],
 "Projetos bem executados":[208,1215],
 "Membros engajados":[615,1221],
 "Confiança":[1152,1228],
 "Prova Real do Serviço":[1472,1238],
 "Ser GAJU":[604,1347],
 "Fidelização do Cliente":[1151,1327],
 "Trabalhamos em Projetos":[1692,1318],
 "Quem nós somos e o que somos capazes":[1919,1397,"Quem nós somos e\no que somos capazes"],
 "União":[272,1476],
 "Responsabilidade socioambiental":[549,1493,"Responsabilidade\nsocioambiental"],
 "Compromisso":[760,1466],
 "Colaboração":[934,1472]
};
const CORE = new Set(["Senso de pertencimento"]);

// Proposições: [conceito inicial, termo de ligação, conceito final, (sem rótulo no desenho)]
const P = [
["Senso de pertencimento","traz para a EJ","Engajamento"],
["Engajamento","acontece devido a uma","Cultura fortalecida"],
["Cultura fortalecida","é resultado de um","Plano Estratégico"],
["Plano Estratégico","é gerenciado pela","Diretoria Executiva"],
["Diretoria Executiva","é formada por","Gestão de Pessoas"],
["Gestão de Pessoas","é responsável pelo","Bem estar dos membros"],
["Bem estar dos membros","é importante para uma","Cultura fortalecida"],
["Membros","só produzem se houver","Senso de pertencimento"],
["Diretoria Executiva","é responsável pelo","Senso de pertencimento"],
["Diretoria Executiva","é formada por","Marketing"],
["Marketing","é responsável pela","Identidade Visual"],
["Identidade Visual","é essencial, pois gera","Reconhecimento de Marca"],
["Reconhecimento de Marca","traz para a EJ","Senso de pertencimento"],
["Diretoria Executiva","propõe a vivência do","MVV"],
["MVV","é a base do","Posicionamento de marca"],
["Posicionamento de marca","também é como a EJ faz a","Comunicação"],
["Comunicação","é um importante meio para a","Visibilidade da EJ"],
["Visibilidade da EJ","traz","Clientes"],
["Clientes","são conquistados se houver","Confiança"],
["Confiança","se ganha se houver","Membros engajados"],
["Membros engajados","realizam","Projetos bem executados"],
["Projetos bem executados","dependem de","Treinamento e Capacitações"],
["Treinamento e Capacitações","são parte do","Desenvolvimento de Carreira"],
["Desenvolvimento de Carreira","que também faz parte das","Gestões futuras"],
["Gestão de Pessoas","é responsável pelo","Desenvolvimento de Carreira"],
["Gestões futuras","precisam das","Atas de eleição"],
["Regularização da EJ","só acontece se houver a entrega das","Atas de eleição"],
["Diretoria Executiva","é formada por","ADM/FINAN"],
["ADM/FINAN","é responsável pela","Regularização da EJ"],
["ADM/FINAN","é responsável pela","Estabilidade financeira"],
["Estabilidade financeira","só existe se houver","Clientes"],
["Membros engajados","entendem o que é","Ser GAJU"],
["Ser GAJU","é uma forma de","Cultura fortalecida"],
["Diretoria Executiva","é formada por","DCOM"],
["DCOM","é responsável pela","Prospecção Ativa"],
["Prospecção Ativa","que é a","Busca por Clientes"],
["Busca por Clientes","gera resultado quando há","Prova Real do Serviço"],
["Diretoria Executiva","é formada por","Projetos"],
["Projetos","criam e gerenciam","Projetos pilotos"],
["Projetos pilotos","podem se tornar","Serviços fixos"],
["Senso de pertencimento","está interligado com o nosso","MVV"],
["Marketing","também faz","Prospecção Passiva"],
["Prospecção Passiva","que é quando o","O cliente vem até nós"],
["O cliente vem até nós","para isso, precisamos de","Prova Real do Serviço"],
["Prova Real do Serviço","gera","Confiança"],
["Prova Real do Serviço","só existe quando realmente","Trabalhamos em Projetos"],
["Trabalhamos em Projetos","quando há","Serviços fixos"],
["Serviços fixos","estão dentro da nossa","Carta de Serviços"],
["Carta de Serviços","que buscam demonstrar","Quem nós somos e o que somos capazes"],
["Quem nós somos e o que somos capazes","e isso é","Ser GAJU"],
["Confiança","traz","Fidelização do Cliente"],
["Fidelização do Cliente","é resultado da","Colaboração"],
["União","é","Ser GAJU"],
["Responsabilidade socioambiental","é","Ser GAJU"],
["Compromisso","é","Ser GAJU"],
["Colaboração","que só realiza isso se tiver","União"],
["Colaboração","que só realiza isso se tiver","Responsabilidade socioambiental",1],
["Colaboração","que só realiza isso se tiver","Compromisso",1]
];
// "Bem estar dos membros" não estava na lista de posições acima
N["Bem estar dos membros"]=[194,829];

const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('sub').textContent=Object.keys(N).length+' conceitos e '+P.length+' proposições';
document.getElementById('count').textContent=P.length+' frases';

const defs=el('defs',{},svg);
const mk=el('marker',{id:'ar',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'8',markerHeight:'8',orient:'auto-start-reverse'},defs);
const arrow=el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--edge)'},mk);
const mk2=el('marker',{id:'ar2',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'8',markerHeight:'8',orient:'auto-start-reverse'},defs);
el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--accent)'},mk2);
const root=el('g',{},svg), gE=el('g',{},root), gN=el('g',{},root);

const nodes={};   // nome -> {x,y,w,h,g}
const edges=[];   // {p,g,path,txt,i}
const bounds={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};

function build(){
  for(const name in N){
    const [x,y,lbl]=N[name];
    const g=el('g',{class:'node'+(CORE.has(name)?' core':''),tabindex:'0',role:'button','aria-label':name,transform:`translate(${x},${y})`},gN);
    const rect=el('rect',{rx:'8',ry:'8'},g);
    const t=el('text',{},g);
    const lines=(lbl||name).split('\n');
    lines.forEach((ln,k)=>{const s=el('tspan',{x:0,dy:k?'1.25em':'0'},t);s.textContent=ln});
    const bb=t.getBBox();
    const w=bb.width+26,h=bb.height+14;
    t.setAttribute('y',-bb.y-bb.height/2);
    rect.setAttribute('x',-w/2);rect.setAttribute('y',-h/2);rect.setAttribute('width',w);rect.setAttribute('height',h);
    nodes[name]={x,y,w,h,g,name};
    bounds.x0=Math.min(bounds.x0,x-w/2);bounds.x1=Math.max(bounds.x1,x+w/2);
    bounds.y0=Math.min(bounds.y0,y-h/2);bounds.y1=Math.max(bounds.y1,y+h/2);
    g.addEventListener('click',e=>{e.stopPropagation();pick(name)});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(name)}});
  }
  const clip=(a,b,pad)=>{
    const dx=b.x-a.x,dy=b.y-a.y;
    const tx=dx?(a.w/2+pad)/Math.abs(dx):1e9, ty=dy?(a.h/2+pad)/Math.abs(dy):1e9;
    const t=Math.min(tx,ty);return [a.x+dx*t,a.y+dy*t];
  };
  P.forEach((p,i)=>{
    const a=nodes[p[0]],b=nodes[p[2]];
    const [x1,y1]=clip(a,b,1),[x2,y2]=clip(b,a,3);
    const g=el('g',{class:'edge'},gE);
    const path=el('path',{d:`M${x1},${y1} L${x2},${y2}`,'marker-end':'url(#ar)'},g);
    let txt=null;
    if(!p[3]){
      // rótulo mais perto do meio; para linhas curtas fica centralizado
      const f=.5;
      txt=el('text',{x:x1+(x2-x1)*f,y:y1+(y2-y1)*f+4},g);
      txt.textContent=p[1];
    }
    edges.push({p,g,path,txt,i});
  });
}

// seleção
let sel=null, selEdge=null;
function clearMarks(){
  svg.classList.remove('dim');
  edges.forEach(e=>{e.g.classList.remove('on');e.path.setAttribute('marker-end','url(#ar)')});
  Object.values(nodes).forEach(n=>n.g.classList.remove('on','sel'));
}
function markEdge(e){e.g.classList.add('on');e.path.setAttribute('marker-end','url(#ar2)');
  nodes[e.p[0]].g.classList.add('on');nodes[e.p[2]].g.classList.add('on')}
function pick(name){
  if(sel===name){reset();return}
  sel=name;selEdge=null;clearMarks();svg.classList.add('dim');
  nodes[name].g.classList.add('sel','on');
  edges.forEach(e=>{if(e.p[0]===name||e.p[2]===name)markEdge(e)});
  q.value='';render(name);
}
function pickEdge(i){
  selEdge=i;sel=null;clearMarks();svg.classList.add('dim');
  markEdge(edges[i]);
  document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
  const e=edges[i],a=nodes[e.p[0]],b=nodes[e.p[2]];
  focusOn([a,b]);
}
function reset(){sel=null;selEdge=null;clearMarks();q.value='';render()}
svg.addEventListener('click',()=>{if(!moved&&(sel||selEdge!==null))reset()});

// lista de frases
const list=document.getElementById('list'),q=document.getElementById('q'),clr=document.getElementById('clear');
function render(name){
  const term=q.value.trim().toLowerCase();
  const rows=P.map((p,i)=>({p,i})).filter(({p})=>{
    if(name)return p[0]===name||p[2]===name;
    if(term)return (p[0]+' '+p[1]+' '+p[2]).toLowerCase().includes(term);
    return true;
  });
  list.innerHTML=rows.length?rows.map(({p,i})=>`<li><button data-i="${i}"><b>${esc(p[0])}</b> <i>${esc(p[1])}</i> <b>${esc(p[2])}</b>.</button></li>`).join(''):'<div class="empty">Nenhuma frase encontrada.</div>';
  clr.hidden=!name;
  clr.textContent=name?`Mostrar todas as frases (filtrando por ${name})`:'';
  document.getElementById('count').textContent=rows.length+(rows.length===1?' frase':' frases');
}
list.addEventListener('click',e=>{const b=e.target.closest('button');if(b)pickEdge(+b.dataset.i)});
q.addEventListener('input',()=>{if(sel||selEdge!==null){sel=null;selEdge=null;clearMarks()}render()});
clr.addEventListener('click',reset);

// zoom e movimento (viewBox)
let vb={x:0,y:0,w:2000,h:1700}, home=null, moved=false;
const apply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function fit(){
  const r=svg.getBoundingClientRect();
  const pad=40,bw=bounds.x1-bounds.x0+pad*2,bh=bounds.y1-bounds.y0+pad*2;
  const ar=r.width/Math.max(r.height,1);
  let w=bw,h=bw/ar;if(h<bh){h=bh;w=bh*ar}
  vb={x:bounds.x0-pad-(w-bw)/2,y:bounds.y0-pad-(h-bh)/2,w,h};apply();
}
function zoom(f,cx,cy){
  const r=svg.getBoundingClientRect();
  const px=cx==null?.5:(cx-r.left)/r.width, py=cy==null?.5:(cy-r.top)/r.height;
  const nw=vb.w/f,nh=vb.h/f;
  vb={x:vb.x+(vb.w-nw)*px,y:vb.y+(vb.h-nh)*py,w:nw,h:nh};apply();
}
function focusOn(ns){
  const x0=Math.min(...ns.map(n=>n.x-n.w/2)),x1=Math.max(...ns.map(n=>n.x+n.w/2));
  const y0=Math.min(...ns.map(n=>n.y-n.h/2)),y1=Math.max(...ns.map(n=>n.y+n.h/2));
  const r=svg.getBoundingClientRect(),ar=r.width/Math.max(r.height,1);
  const pad=160;let w=x1-x0+pad*2,h=y1-y0+pad*2;
  if(w/h<ar)w=h*ar;else h=w/ar;
  w=Math.max(w,500);h=w/ar;
  vb={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h};apply();
}
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let last=null,pinch=0;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=false;last=[e.clientX,e.clientY];
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  const r=svg.getBoundingClientRect();
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinch)zoom(d/pinch,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch=d;moved=true;return;
  }
  const dx=e.clientX-last[0],dy=e.clientY-last[1];
  if(!moved&&Math.hypot(dx,dy)<4)return;
  if(!moved){svg.classList.add('drag');svg.setPointerCapture(e.pointerId)}
  moved=true;
  vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;last=[e.clientX,e.clientY];apply();
});
const up=e=>{ptrs.delete(e.pointerId);pinch=0;svg.classList.remove('drag');last=ptrs.size?[...ptrs.values()][0]:null;setTimeout(()=>{if(!ptrs.size)moved=false},0)};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=()=>zoom(1.3);
document.getElementById('zout').onclick=()=>zoom(1/1.3);
document.getElementById('zfit').onclick=fit;
window.addEventListener('resize',()=>{if(!sel&&selEdge===null)fit()});

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).catch(()=>{}).then(()=>{
  build();render();fit();
});
</script>
</body>
</html>
